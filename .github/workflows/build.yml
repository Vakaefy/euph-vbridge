name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build client
        working-directory: client
        run: ./gradlew build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: euph-vbridge
          path: client/build/libs/euph-vbridge-*.jar
